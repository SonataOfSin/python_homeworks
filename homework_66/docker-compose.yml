services:
  db:
    image: postgres:16
    container_name: task-db
    environment:
      POSTGRES_DB: tasks_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - task-network

  api:
    build: .
    container_name: task-api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/tasks_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task-network

volumes:
  postgres_data:

networks:
  task-network:
    name: task-network
    driver: bridge
